<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/layout}">
<head>
    <title>공지 쓰기</title>
</head>

<div layout:fragment="content" class="page" style="max-width: 640px">
    <h1 class="page-title fs-2 mb-4">공지 쓰기</h1>
    <form th:action="@{${formAction}}" th:object="${noticeDto}" method="post">
        <div class="mb-3">
            <label class="form-label fw-semibold" for="subject">제목</label>
            <input type="text" th:field="*{subject}" id="subject" class="form-control">
            <p th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}" class="fieldError"></p>
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold" for="content">내용</label>
            <textarea th:field="*{content}" id="content" class="form-control" rows="10"></textarea>
            <p th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="fieldError"></p>
        </div>
        <div class="d-flex justify-content-end gap-2">
            <a th:href="@{/notice}" class="btn-gray">취소</a>
            <button type="submit" class="btn-blue">저장</button>
        </div>
    </form>
</div>
</html>
