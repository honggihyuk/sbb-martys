<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title th:text="${memberId == null} ? '회원 등록' : '회원 수정'">회원 등록</title>
</head>

<!-- 관리자 : 회원 등록 / 수정 (memberId 가 null 이면 등록) -->
<th:block layout:fragment="script">
    <script th:src="@{/js/team-select.js}"></script>
</th:block>

<div layout:fragment="content" class="page" style="max-width: 640px">
    <div class="eyebrow">관리자 모드</div>
    <h1 class="page-title" th:text="${memberId == null} ? '회원 등록' : '회원 수정'">회원 등록</h1>
    <div class="page-sub" th:text="${memberId == null} ? '관리자가 직접 참가자 계정을 만들어요' : '비밀번호는 바꿀 때만 입력하세요'">설명</div>

    <form th:action="${memberId == null} ? @{/admin/member/new} : @{|/admin/member/${memberId}/edit|}"
          th:object="${adminMemberDto}" method="post" class="mt-4">
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label for="username" class="form-label fw-semibold">사용자ID</label>
                <input type="text" th:field="*{username}" class="form-control" autocomplete="off">
                <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="fieldError"></p>
            </div>
            <div class="col-md-6">
                <label for="name" class="form-label fw-semibold">이름</label>
                <input type="text" th:field="*{name}" class="form-control">
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="fieldError"></p>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label for="password" class="form-label fw-semibold">
                    <th:block th:text="${memberId == null} ? '비밀번호' : '새 비밀번호'">비밀번호</th:block>
                    <span th:if="${memberId != null}" class="text-muted fw-normal">(바꿀 때만)</span>
                </label>
                <input type="password" th:field="*{password}" class="form-control" autocomplete="new-password" placeholder="4자 이상">
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="fieldError"></p>
            </div>
            <div class="col-md-6">
                <label for="email" class="form-label fw-semibold">이메일 <span class="text-muted fw-normal">(선택)</span></label>
                <input type="email" th:field="*{email}" class="form-control">
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="fieldError"></p>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <label for="teamNo" class="form-label fw-semibold">조</label>
                <select th:field="*{teamNo}" class="form-select" data-sled-from="community">
                    <option value="">조 없음</option>
                    <option th:each="t : ${teams}" th:value="${t.key}" th:text="${t.value}">1조</option>
                </select>
                <div class="sled-note" hidden>SL·ED 소속은 <b>SLED조</b>로 자동 배정돼요</div>
            </div>
            <div class="col-md-4">
                <label for="role" class="form-label fw-semibold">권한</label>
                <select th:field="*{role}" class="form-select">
                    <!-- 조장 권한은 SL·ED 소속이면 화면에 '리더'로 보인다 (Member.getLeaderLabel) -->
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r.name() == 'LEADER'} ? '조장·리더' : ${r.label}">이용자</option>
                </select>
                <p th:if="${#fields.hasErrors('role')}" th:errors="*{role}" class="fieldError"></p>
            </div>
            <div class="col-md-4">
                <label for="community" class="form-label fw-semibold">소속</label>
                <select th:field="*{community}" class="form-select">
                    <option value="">소속을 선택하세요</option>
                    <option th:each="c : ${communities}" th:value="${c}" th:text="${c.label}" th:attr="data-sled=${c.sled}">송도</option>
                </select>
                <p th:if="${#fields.hasErrors('community')}" th:errors="*{community}" class="fieldError"></p>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-12">
                <label class="form-label fw-semibold d-block">성별</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" th:field="*{gender}" id="genderMale" value="MALE">
                    <label class="form-check-label" for="genderMale">남성</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" th:field="*{gender}" id="genderFemale" value="FEMALE">
                    <label class="form-check-label" for="genderFemale">여성</label>
                </div>
                <p th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}" class="fieldError"></p>
            </div>
        </div>

        <div class="mb-4 form-check">
            <input class="form-check-input" type="checkbox" th:field="*{registration}">
            <label class="form-check-label" th:for="${#ids.prev('registration')}">성서지리 참가 등록 확인</label>
        </div>

        <div class="d-flex justify-content-between">
            <a th:href="@{/admin}" class="btn-gray">목록으로</a>
            <button type="submit" class="btn-blue" th:text="${memberId == null} ? '등록하기' : '저장하기'">등록하기</button>
        </div>
    </form>
</div>
</html>
