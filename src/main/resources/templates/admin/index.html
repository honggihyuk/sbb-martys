<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>관리자</title>
</head>

<div layout:fragment="content" class="page" style="max-width: 980px">
    <div class="page-head">
        <div>
            <div class="eyebrow">관리자 모드</div>
            <h1 class="page-title">회원 관리</h1>
            <div class="page-sub" th:text="|전체 회원 ${#lists.size(memberList)}명 · 등록·수정·삭제, 조와 권한(이용자/조장·리더/관리자)을 정해요|">전체 회원</div>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/admin/member/new}" class="btn-blue">+ 회원 등록</a>
            <a th:href="@{/}" class="btn-gray">사이트로</a>
            <form th:action="@{/admin/logout}" method="post" class="m-0">
                <button type="submit" class="btn-gray">로그아웃</button>
            </form>
        </div>
    </div>

    <div th:if="${adminMessage}" class="alert alert-primary py-2 small" th:text="${adminMessage}">등록했어요.</div>

    <div class="table-responsive">
        <table class="table admin-table align-middle">
            <thead>
            <tr class="text-muted">
                <th>이름</th><th>사용자ID</th><th>소속</th><th>가입일</th><th style="width: 330px">조 · 권한</th><th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${memberList}">
                <td>
                    <span th:replace="~{fragments/avatar :: avatar(${m}, '')}"></span>
                    <span class="fw-semibold ms-1" th:text="${m.displayName}">홍기혁</span>
                </td>
                <td th:text="${m.username}">hong</td>
                <td th:text="${m.subtitle}">송도 · 남</td>
                <td class="text-muted" th:text="${m.created != null ? #temporals.format(m.created, 'yyyy-MM-dd') : '-'}">2026-11-11</td>
                <td>
                    <!-- 조와 권한을 바꾸고 저장 -->
                    <form th:action="@{|/admin/member/${m.id}|}" method="post" class="d-flex gap-2 m-0">
                        <!-- 소속이 SL·ED 면 SLED조 고정 (저장할 때도 서버가 SLED조로 맞춘다) -->
                        <select name="teamNo" class="form-select form-select-sm" th:disabled="${m.community?.sled}"
                                th:title="${m.community?.sled} ? 'SL·ED 소속은 SLED조로 자동 배정돼요'">
                            <option value="">조 없음</option>
                            <option th:each="t : ${teams}" th:value="${t.key}"
                                    th:text="${t.value}" th:selected="${m.teamNo == t.key}">1조</option>
                        </select>
                        <select name="role" class="form-select form-select-sm">
                            <option th:each="r : ${roles}" th:value="${r}"
                                    th:text="${r.name() == 'LEADER'} ? ${m.leaderLabel} : ${r.label}"
                                    th:selected="${m.role == r or (m.role == null and r.name() == 'USER')}">이용자</option>
                        </select>
                        <button type="submit" class="btn-blue btn-sm text-nowrap" style="padding:.3rem .8rem">저장</button>
                    </form>
                </td>
                <td class="text-nowrap">
                    <a th:href="@{|/admin/member/${m.id}/edit|}" class="link-btn me-2">수정</a>
                    <form th:unless="${loginMember != null and loginMember.id == m.id}"
                          th:action="@{|/admin/member/${m.id}/delete|}" method="post" class="d-inline m-0"
                          th:data-name="${m.displayName}"
                          onsubmit="return confirm(this.dataset.name + ' 님을 삭제할까요? 말씀·운동 체크 기록도 같이 지워져요.');">
                        <button type="submit" class="link-btn text-danger">삭제</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</html>
