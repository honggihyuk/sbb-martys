<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/layout}">
<head>
    <title>회의록</title>
</head>

<div layout:fragment="content" class="page" style="max-width: 640px">
    <a th:href="@{/minutes}" class="small text-muted">‹ 회의록</a>
    <div class="text-muted small mt-3" th:text="${#temporals.format(minutes.meetingDate, 'yyyy년 M월 d일 EEEE')}">날짜</div>
    <h1 class="page-title fs-2 mb-4" th:text="${minutes.title}">제목</h1>
    <div class="note-text" th:text="${minutes.content}">내용</div>
    <div class="d-flex justify-content-between align-items-center mt-4">
        <span class="note-meta mt-0" th:text="|작성 · ${minutes.author?.displayName ?: '탈퇴한 회원'}|">작성 · 홍기혁</span>
        <form th:action="@{|/minutes/${minutes.id}/delete|}" method="post" onsubmit="return confirm('삭제할까요?');">
            <button type="submit" class="link-btn">삭제</button>
        </form>
    </div>
</div>
</html>
