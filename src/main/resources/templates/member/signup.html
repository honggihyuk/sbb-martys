<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>회원가입</title>
</head>

<th:block layout:fragment="script">
    <script th:src="@{/js/team-select.js}"></script>
</th:block>

<div layout:fragment="content" class="auth-wrap">
    <div class="auth-card wide">
        <div class="eyebrow">마르투스 · Martys</div>
        <div class="brand-lg">회원가입</div>
        <p class="sub">성서지리 참여자 계정을 만들어 주세요</p>

        <form th:action="@{/member/signup}" th:object="${memberDto}" method="post">
            <div class="row g-3 mb-3">
                <!-- 사용자ID -->
                <div class="col-md-6">
                    <label for="username" class="form-label fw-semibold">사용자ID</label>
                    <input type="text" th:field="*{username}" id="username" class="form-control" placeholder="3~30자" autocomplete="username">
                    <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="fieldError"></p>
                </div>
                <!-- 이름 -->
                <div class="col-md-6">
                    <label for="name" class="form-label fw-semibold">이름</label>
                    <input type="text" th:field="*{name}" id="name" class="form-control" placeholder="예: 홍기혁">
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="fieldError"></p>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="password1" class="form-label fw-semibold">비밀번호</label>
                    <input type="password" th:field="*{password1}" id="password1" class="form-control" placeholder="4자 이상" autocomplete="new-password">
                    <p th:if="${#fields.hasErrors('password1')}" th:errors="*{password1}" class="fieldError"></p>
                </div>
                <div class="col-md-6">
                    <label for="password2" class="form-label fw-semibold">비밀번호 확인</label>
                    <input type="password" th:field="*{password2}" id="password2" class="form-control" autocomplete="new-password">
                    <p th:if="${#fields.hasErrors('password2')}" th:errors="*{password2}" class="fieldError"></p>
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">이메일 <span class="text-muted fw-normal">(선택)</span></label>
                <input type="email" th:field="*{email}" id="email" class="form-control" placeholder="name@example.com" autocomplete="email">
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="fieldError"></p>
            </div>

            <div class="row g-3 mb-3">
                <!-- 소속 (필수) : 목록은 member/constant/Community enum -->
                <div class="col-md-6">
                    <label for="community" class="form-label fw-semibold">소속</label>
                    <select th:field="*{community}" id="community" class="form-select">
                        <option value="">소속을 선택하세요</option>
                        <option th:each="c : ${communities}" th:value="${c}" th:text="${c.label}" th:attr="data-sled=${c.sled}">송도</option>
                    </select>
                    <p th:if="${#fields.hasErrors('community')}" th:errors="*{community}" class="fieldError"></p>
                </div>
                <!-- 조 (1조 ~ TEAM_COUNT조) : 소속이 SL·ED 면 숨기고 SLED조로 자동 배정 (static/js/team-select.js) -->
                <div class="col-md-6">
                    <label for="teamNo" class="form-label fw-semibold">조</label>
                    <select th:field="*{teamNo}" id="teamNo" class="form-select" data-sled-from="community">
                        <option value="">조를 선택하세요</option>
                        <option th:each="t : ${teams}" th:value="${t.key}" th:text="${t.value}">1조</option>
                    </select>
                    <div class="sled-note" hidden>SL·ED 소속은 <b>SLED조</b>로 자동 배정돼요</div>
                    <p th:if="${#fields.hasErrors('teamNo')}" th:errors="*{teamNo}" class="fieldError"></p>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <!-- 성별 (라디오) -->
                <div class="col-12">
                    <label class="form-label fw-semibold d-block">성별</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" th:field="*{gender}" id="genderMale" value="MALE">
                        <label class="form-check-label" for="genderMale">남성</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" th:field="*{gender}" id="genderFemale" value="FEMALE">
                        <label class="form-check-label" for="genderFemale">여성</label>
                    </div>
                    <p th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}" class="fieldError"></p>
                </div>
            </div>

            <div class="mb-4 form-check">
                <input class="form-check-input" type="checkbox" th:field="*{registration}" id="registration">
                <label class="form-check-label" for="registration">(필수) 2026 신약 성서지리 참여 등록을 확인했습니다.</label>
                <p th:if="${#fields.hasErrors('registration')}" th:errors="*{registration}" class="fieldError"></p>
            </div>

            <button type="submit" class="btn-blue">회원가입</button>
        </form>

        <div class="auth-foot">
            이미 계정이 있나요? <a th:href="@{/member/login}" class="fw-semibold">로그인</a>
        </div>
    </div>
</div>
</html>
