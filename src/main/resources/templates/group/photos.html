<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/layout}">
<head>
    <title>조별 활동</title>
</head>

<div layout:fragment="content" class="page">
    <div class="eyebrow">마르투스</div>
    <h1 class="page-title">조별 활동</h1>
    <div class="page-sub" th:text="|${teamCount}개 조 · 단체 사진은 조장·리더가 올려요|">7개 조 · 단체 사진은 조장·리더가 올려요</div>

    <div class="sub-tabs">
        <a th:href="@{/group}" class="active">조원·사진</a>
        <a th:href="@{/group(view='notes')}">조별 의견</a>
    </div>

    <!-- 내 조 : 크게 -->
    <section th:if="${myTeam != null}" class="mb-4">
        <div class="sec-head">
            <h3 th:text="|${myTeam.name} · 내 조|">5조 · 내 조</h3>
            <span class="meta" th:text="|${#lists.size(myTeam.members())}명|">4명</span>
        </div>
        <div class="row g-4 align-items-center">
            <div class="col-md-6">
                <div class="photo-wrap">
                    <img th:if="${myTeam.info().photoPath != null}" th:src="${myTeam.info().photoPath}" class="photo" alt="조 사진">
                    <div th:unless="${myTeam.info().photoPath != null}" class="photo-empty">아직 단체 사진이 없어요</div>

                    <!-- 조장·리더만 사진 바꾸기 / 지우기 -->
                    <div class="photo-actions" th:if="${canEditPhoto}">
                        <form th:action="@{|/group/${myTeam.teamNo()}/photo|}" method="post" enctype="multipart/form-data" class="m-0">
                            <label class="pill mb-0" style="cursor:pointer">
                                사진 바꾸기
                                <input type="file" name="photo" accept="image/*" hidden onchange="this.form.submit()">
                            </label>
                        </form>
                        <form th:if="${myTeam.info().photoPath != null}" th:action="@{|/group/${myTeam.teamNo()}/photo/delete|}" method="post" class="m-0">
                            <button type="submit" class="pill">지우기</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div th:replace="~{fragments/members :: grid(${myTeam.members()})}"></div>
            </div>
        </div>
    </section>
    <p th:if="${myTeam == null}" class="text-muted">아직 조가 정해지지 않았어요. 관리자에게 문의해 주세요.</p>

    <hr class="divider">

    <!-- 다른 조 -->
    <div class="grid-2">
        <section th:each="team : ${otherTeams}">
            <div class="sec-head">
                <h3 th:text="${team.name}">1조</h3>
                <span class="meta" th:text="|${#lists.size(team.members())}명|">5명</span>
            </div>
            <img th:if="${team.info().photoPath != null}" th:src="${team.info().photoPath}" class="photo" alt="조 사진">
            <div th:unless="${team.info().photoPath != null}" class="photo-empty">아직 단체 사진이 없어요</div>
            <div class="mt-3" th:insert="~{fragments/members :: grid(${team.members()})}"></div>
            <p th:if="${#lists.isEmpty(team.members())}" class="text-muted small mt-2">아직 조원이 없어요</p>
        </section>
    </div>
</div>
</html>
